<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#007bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid7" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg7)"/>
  <rect width="800" height="450" fill="url(#grid7)"/>
  <circle cx="640" cy="100" r="220" fill="url(#orb7)"/>
  <circle cx="110" cy="380" r="170" fill="url(#orb7)" opacity="0.5"/>

  <!-- search bar -->
  <g transform="translate(150,120)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <circle cx="34" cy="30" r="10" fill="none" stroke="#00c2ff" stroke-width="3"/>
    <line x1="41" y1="37" x2="50" y2="46" stroke="#00c2ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="70" y="22" width="220" height="16" rx="8" fill="#3a4452"/>
  </g>

  <!-- result cards -->
  <g transform="translate(150,210)">
    <rect x="0" y="0" width="500" height="54" rx="10" fill="#161b22" stroke="#00c2ff" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="30" cy="27" r="14" fill="url(#accent7)"/>
    <rect x="56" y="14" width="180" height="10" rx="5" fill="#00c2ff" opacity="0.85"/>
    <rect x="56" y="30" width="260" height="8" rx="4" fill="#5c6773"/>

    <rect x="0" y="66" width="500" height="54" rx="10" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <circle cx="30" cy="93" r="14" fill="#2a323e"/>
    <rect x="56" y="80" width="150" height="10" rx="5" fill="#5c6773"/>
    <rect x="56" y="96" width="220" height="8" rx="4" fill="#3a4452"/>

    <rect x="0" y="132" width="500" height="54" rx="10" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <circle cx="30" cy="159" r="14" fill="#2a323e"/>
    <rect x="56" y="146" width="170" height="10" rx="5" fill="#5c6773"/>
    <rect x="56" y="162" width="240" height="8" rx="4" fill="#3a4452"/>
  </g>

  <!-- map pin badge -->
  <g transform="translate(660,300)">
    <circle r="34" fill="#161b22" stroke="url(#accent7)" stroke-width="3"/>
    <path d="M0 -14 C10 -14 16 -6 16 2 C16 12 0 22 0 22 C0 22 -16 12 -16 2 C-16 -6 -10 -14 0 -14 Z" fill="#00c2ff"/>
    <circle cx="0" cy="0" r="5" fill="#0d1117"/>
  </g>

  <text x="40" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">SEO &amp; VISIBILITY</text>
  <text x="40" y="410" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#e6e6e6">Get Your Business on Google</text>
</svg>
