<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>
  <rect width="800" height="450" fill="url(#grid5)"/>
  <circle cx="620" cy="120" r="220" fill="url(#orb5)"/>
  <circle cx="120" cy="380" r="160" fill="url(#orb5)" opacity="0.6"/>

  <!-- chat bubbles -->
  <g transform="translate(90,120)">
    <rect x="0" y="0" width="230" height="60" rx="18" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="9" rx="4.5" fill="#5c6773"/>
    <rect x="20" y="36" width="90" height="9" rx="4.5" fill="#3a4452"/>

    <rect x="60" y="90" width="230" height="60" rx="18" fill="url(#accent5)"/>
    <rect x="80" y="110" width="150" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
    <rect x="80" y="126" width="100" height="9" rx="4.5" fill="#ffffff" opacity="0.65"/>

    <rect x="10" y="180" width="230" height="60" rx="18" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <rect x="30" y="200" width="120" height="9" rx="4.5" fill="#5c6773"/>
    <rect x="30" y="216" width="150" height="9" rx="4.5" fill="#3a4452"/>
  </g>

  <!-- robot / automation glyph -->
  <g transform="translate(560,190)">
    <rect x="-60" y="-50" width="120" height="100" rx="20" fill="#161b22" stroke="url(#accent5)" stroke-width="3"/>
    <circle cx="-25" cy="-8" r="10" fill="#00c2ff"/>
    <circle cx="25" cy="-8" r="10" fill="#00c2ff"/>
    <rect x="-28" y="18" width="56" height="8" rx="4" fill="#3a4452"/>
    <line x1="0" y1="-50" x2="0" y2="-72" stroke="#00c2ff" stroke-width="3"/>
    <circle cx="0" cy="-78" r="7" fill="#00c2ff"/>
    <rect x="-72" y="-14" width="14" height="30" rx="6" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <rect x="58" y="-14" width="14" height="30" rx="6" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
  </g>

  <!-- whatsapp badge -->
  <g transform="translate(420,340)">
    <circle r="30" fill="#25D366"/>
    <path d="M-9 9 L-11 15 L-5 13 C-2 15 1 15 4 14 C11 11 13 3 10 -3 C7 -9 -1 -11 -7 -8 C-13 -5 -15 3 -11 9 Z" fill="none" stroke="#ffffff" stroke-width="0"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#ffffff">✆</text>
  </g>

  <text x="40" y="390" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">AI AUTOMATION</text>
  <text x="40" y="418" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#e6e6e6">WhatsApp AI Order Bots</text>
</svg>
