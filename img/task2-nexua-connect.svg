<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>
  <circle cx="120" cy="80" r="200" fill="url(#orb2)"/>
  <circle cx="700" cy="380" r="180" fill="url(#orb2)" opacity="0.6"/>

  <!-- social graph -->
  <g stroke="#00c2ff" stroke-opacity="0.35" stroke-width="1.6">
    <line x1="400" y1="150" x2="250" y2="240"/>
    <line x1="400" y1="150" x2="400" y2="260"/>
    <line x1="400" y1="150" x2="550" y2="230"/>
    <line x1="250" y1="240" x2="180" y2="320"/>
    <line x1="250" y1="240" x2="320" y2="330"/>
    <line x1="400" y1="260" x2="320" y2="330"/>
    <line x1="400" y1="260" x2="470" y2="330"/>
    <line x1="550" y1="230" x2="470" y2="330"/>
    <line x1="550" y1="230" x2="620" y2="310"/>
  </g>

  <g>
    <circle cx="400" cy="150" r="34" fill="#161b22" stroke="url(#accent2)" stroke-width="2.5"/>
    <circle cx="400" cy="142" r="9" fill="#00c2ff"/>
    <path d="M382 168 q18 -16 36 0" fill="none" stroke="#00c2ff" stroke-width="3" stroke-linecap="round"/>

    <circle cx="250" cy="240" r="26" fill="#161b22" stroke="#3a4452" stroke-width="2"/>
    <circle cx="250" cy="234" r="7" fill="#5c6773"/>
    <path d="M237 254 q13 -12 26 0" fill="none" stroke="#5c6773" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="400" cy="260" r="26" fill="#161b22" stroke="#3a4452" stroke-width="2"/>
    <circle cx="400" cy="254" r="7" fill="#5c6773"/>
    <path d="M387 274 q13 -12 26 0" fill="none" stroke="#5c6773" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="550" cy="230" r="26" fill="#161b22" stroke="#3a4452" stroke-width="2"/>
    <circle cx="550" cy="224" r="7" fill="#5c6773"/>
    <path d="M537 244 q13 -12 26 0" fill="none" stroke="#5c6773" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="180" cy="320" r="18" fill="#161b22" stroke="#2a323e" stroke-width="1.6"/>
    <circle cx="320" cy="330" r="18" fill="#161b22" stroke="#2a323e" stroke-width="1.6"/>
    <circle cx="470" cy="330" r="18" fill="#161b22" stroke="#2a323e" stroke-width="1.6"/>
    <circle cx="620" cy="310" r="18" fill="#161b22" stroke="#2a323e" stroke-width="1.6"/>
  </g>

  <!-- like/heart badge near main node -->
  <g transform="translate(452,120)">
    <circle r="16" fill="#0d1117" stroke="#00c2ff" stroke-width="1.6"/>
    <path d="M0 5 C-6 -3 -14 3 0 12 C14 3 6 -3 0 5 Z" fill="#00c2ff"/>
  </g>

  <text x="40" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">CODEALPHA · TASK 2</text>
  <text x="40" y="425" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" fill="#e6e6e6">NEXUA Connect — Social Platform</text>
</svg>
