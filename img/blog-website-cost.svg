<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  <rect width="800" height="450" fill="url(#grid4)"/>
  <circle cx="650" cy="110" r="220" fill="url(#orb4)"/>
  <circle cx="100" cy="380" r="160" fill="url(#orb4)" opacity="0.5"/>

  <!-- bar chart rising -->
  <g transform="translate(140,300)">
    <rect x="0" y="60" width="70" height="60" rx="8" fill="#1c2330" stroke="#2a323e"/>
    <rect x="100" y="30" width="70" height="90" rx="8" fill="#1c2330" stroke="#2a323e"/>
    <rect x="200" y="-10" width="70" height="130" rx="8" fill="url(#accent4)" opacity="0.85"/>
    <rect x="300" y="-60" width="70" height="180" rx="8" fill="url(#accent4)"/>
    <path d="M20 55 L120 25 L220 -15 L320 -65" fill="none" stroke="#e6e6e6" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
    <circle cx="20" cy="55" r="5" fill="#e6e6e6"/>
    <circle cx="120" cy="25" r="5" fill="#e6e6e6"/>
    <circle cx="220" cy="-15" r="5" fill="#e6e6e6"/>
    <circle cx="320" cy="-65" r="5" fill="#e6e6e6"/>
  </g>

  <!-- naira badge -->
  <g transform="translate(560,90)">
    <circle r="70" fill="#161b22" stroke="url(#accent4)" stroke-width="3"/>
    <text x="0" y="24" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" fill="#00c2ff" text-anchor="middle">₦</text>
  </g>
  <g transform="translate(660,190)">
    <circle r="26" fill="#161b22" stroke="#3a4452" stroke-width="2"/>
    <text x="0" y="9" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#8b949e" text-anchor="middle">$</text>
  </g>

  <text x="40" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">PRICING GUIDE</text>
  <text x="40" y="410" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#e6e6e6">Website Cost in Nigeria, 2026</text>
</svg>
