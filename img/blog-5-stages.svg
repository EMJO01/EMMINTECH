<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent6" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#007bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)"/>
  <rect width="800" height="450" fill="url(#grid6)"/>
  <circle cx="120" cy="90" r="200" fill="url(#orb6)"/>
  <circle cx="700" cy="360" r="180" fill="url(#orb6)" opacity="0.5"/>

  <!-- 5 ascending stage bars -->
  <g transform="translate(110,330)">
    <rect x="0"   y="-40"  width="88" height="40"  rx="8" fill="#1c2330" stroke="#2a323e" stroke-width="2"/>
    <rect x="108" y="-80"  width="88" height="80"  rx="8" fill="#1c2330" stroke="#2a323e" stroke-width="2"/>
    <rect x="216" y="-130" width="88" height="130" rx="8" fill="#1c2330" stroke="#00c2ff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="324" y="-190" width="88" height="190" rx="8" fill="url(#accent6)" opacity="0.85"/>
    <rect x="432" y="-260" width="88" height="260" rx="8" fill="url(#accent6)"/>

    <text x="44"  y="-52"  font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#5c6773">1</text>
    <text x="152" y="-92"  font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#5c6773">2</text>
    <text x="260" y="-142" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#00c2ff">3</text>
    <text x="368" y="-202" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#0d1117">4</text>
    <text x="476" y="-272" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#0d1117">5</text>

    <!-- baseline -->
    <line x1="-20" y1="0" x2="560" y2="0" stroke="#2a323e" stroke-width="2"/>
  </g>

  <!-- rocket / star marker at top of stage 5 -->
  <g transform="translate(586,68)">
    <circle r="24" fill="#161b22" stroke="url(#accent6)" stroke-width="2.5"/>
    <path d="M0 -12 L4 -2 L14 -2 L6 5 L9 15 L0 8 L-9 15 L-6 5 L-14 -2 L-4 -2 Z" fill="#00c2ff"/>
  </g>

  <text x="40" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">BUSINESS GROWTH</text>
  <text x="40" y="410" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#e6e6e6">Invisible → Scaled: 5 Stages</text>
</svg>
