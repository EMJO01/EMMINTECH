<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#007bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg1)"/>
  <rect width="800" height="450" fill="url(#grid1)"/>
  <circle cx="650" cy="90" r="220" fill="url(#orb1)"/>
  <circle cx="90" cy="400" r="160" fill="url(#orb1)" opacity="0.6"/>

  <!-- storefront card -->
  <g transform="translate(230,95)">
    <rect x="0" y="0" width="340" height="260" rx="18" fill="#161b22" stroke="#2a323e" stroke-width="2"/>
    <!-- header bar -->
    <rect x="0" y="0" width="340" height="46" rx="18" fill="#1c2330"/>
    <rect x="0" y="28" width="340" height="18" fill="#1c2330"/>
    <circle cx="26" cy="23" r="5" fill="#ff5f57"/>
    <circle cx="46" cy="23" r="5" fill="#febc2e"/>
    <circle cx="66" cy="23" r="5" fill="#28c840"/>
    <rect x="240" y="14" width="80" height="18" rx="9" fill="url(#accent1)" opacity="0.85"/>

    <!-- product grid -->
    <g>
      <rect x="24" y="70" width="90" height="70" rx="10" fill="#0d1117" stroke="#2a323e"/>
      <rect x="128" y="70" width="90" height="70" rx="10" fill="#0d1117" stroke="#2a323e"/>
      <rect x="232" y="70" width="84" height="70" rx="10" fill="#0d1117" stroke="#2a323e"/>
      <circle cx="69" cy="105" r="18" fill="url(#accent1)" opacity="0.5"/>
      <circle cx="173" cy="105" r="18" fill="url(#accent1)" opacity="0.35"/>
      <circle cx="274" cy="105" r="18" fill="url(#accent1)" opacity="0.5"/>

      <rect x="24" y="150" width="70" height="8" rx="4" fill="#3a4452"/>
      <rect x="128" y="150" width="70" height="8" rx="4" fill="#3a4452"/>
      <rect x="232" y="150" width="60" height="8" rx="4" fill="#3a4452"/>
      <rect x="24" y="164" width="40" height="8" rx="4" fill="#00c2ff" opacity="0.7"/>
      <rect x="128" y="164" width="40" height="8" rx="4" fill="#00c2ff" opacity="0.7"/>
      <rect x="232" y="164" width="40" height="8" rx="4" fill="#00c2ff" opacity="0.7"/>
    </g>

    <!-- cart / checkout bar -->
    <rect x="24" y="196" width="292" height="42" rx="10" fill="url(#accent1)" opacity="0.14" stroke="#00c2ff" stroke-opacity="0.4"/>
    <g transform="translate(38,208)">
      <path d="M0 2 H4 L8 16 H22 L26 6 H6" fill="none" stroke="#00c2ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="10" cy="21" r="2.4" fill="#00c2ff"/>
      <circle cx="20" cy="21" r="2.4" fill="#00c2ff"/>
    </g>
    <rect x="240" y="211" width="60" height="14" rx="7" fill="#00c2ff"/>
  </g>

  <text x="40" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#00c2ff" opacity="0.8">CODEALPHA · TASK 1</text>
  <text x="40" y="425" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" fill="#e6e6e6">NEXUA — E-Commerce Platform</text>
</svg>
